name: Release Obsidian plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:all
      - name: Verify tag and manifest versions
        run: node scripts/verify-release-version.mjs "${GITHUB_REF_NAME}"
      - name: Package plugin
        run: |
          mkdir -p release-package/xhs-text-card
          cp main.js manifest.json styles.css release-package/xhs-text-card/
          cd release-package
          zip -r "../text-to-card-${GITHUB_REF_NAME}.zip" xhs-text-card
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
            text-to-card-${{ github.ref_name }}.zip
